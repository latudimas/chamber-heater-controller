<text x="0" y="72.0">Outlet box flat pattern: sheet ~1 mm, strip 354 x 46 mm + 4 clamp tabs.</text>
<text x="0" y="77.0">Red dashed = bend 90 deg. Fold into a tube (inner ~96 x 72), seam overlaps and is</text>
<text x="0" y="82.0">riveted/screwed. Tabs bend OUTWARD and are clamped by the 4 flange bolts.</text>
<text x="0" y="87.0">Bend allowance not included: cut slightly long and trim. 6 mm hole = DS18B20 probe.</text>
<text x="0" y="92.0">Upstream edge (tabs) faces the PTC plate; the other end is the hot-air outlet.</text>
