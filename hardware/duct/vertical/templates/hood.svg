<text x="0" y="208.0">Hood flat pattern: sheet ~1 mm, 204 x 193 mm overall (print on A3, or tile).</text>
<text x="0" y="213.0">Red dashed = bend 90 deg. Fold the four walls DOWN from the roof, then fold the</text>
<text x="0" y="218.0">corner flaps onto the front/back walls and rivet or screw them.</text>
<text x="0" y="223.0">Clamp tabs on the free edges bend OUTWARD. Drill the tab holes after bending:</text>
<text x="0" y="228.0">they sit only 3 mm from the wall. 6 mm hole = DS18B20 probe.</text>
<text x="0" y="233.0">Bend allowance not included: cut slightly large and trim.</text>
