<text x="0" y="163.0">Hood flat pattern: sheet ~1 mm, 293 x 148 mm overall (print on A3 landscape).</text>
<text x="0" y="168.0">Red dashed = bend 90 deg. Fold the four walls DOWN from the roof, then fold the</text>
<text x="0" y="173.0">corner flaps onto the front/back walls and rivet or screw them.</text>
<text x="0" y="178.0">Clamp tabs on the free edges bend OUTWARD. Drill the tab holes after bending:</text>
<text x="0" y="183.0">they sit only 3 mm from the wall. 6 mm hole = DS18B20 probe.</text>
<text x="0" y="188.0">Bend allowance not included: cut slightly large and trim.</text>
